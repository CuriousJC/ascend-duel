# Runs on every push to main and every pull request.
#
# **Windows is the only runner, deliberately.** Ebitengine is cgo-free on Windows but needs
# X11 development headers on Linux and a real toolchain on macOS, so a Linux runner would
# either fail to build the game or need apt packages installed to prove something nobody
# ships. Windows is the platform being released; it is the platform being checked.
#
# **Both build tags, every time.** internal/trace selects a different file on `debugtrace`,
# so one configuration compiles while the other does not. That has broken before, and a CI
# that only checks the default build would not have caught it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow inspects the code and publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Reads the version from go.mod, so the toolchain cannot drift from the module.
          go-version-file: go.mod
          cache: true

      # gofmt exits 0 whether or not it found anything, so the check is on its output.
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          go vet -tags debugtrace ./...

      - name: build
        run: |
          go build ./...
          go build -tags debugtrace ./...

      # internal/combat is the only package with tests, by design: it is the only one that
      # needs no window. Keep it that way and this step needs no display server.
      - name: test
        run: go test ./...
