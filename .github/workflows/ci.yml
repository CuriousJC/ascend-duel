# Runs on every push to main and every pull request.
#
# **Both platforms that get released, because both can break on their own.** Ebitengine is
# pure Go on Windows and cgo plus X11/GL/ALSA headers on Linux, so they fail in completely
# different ways — a missing dev package or a cgo-only compile error is invisible from a
# Windows runner. Checking Linux here rather than only at tag time is the difference between
# a red PR and a release that dies halfway through.
#
# macOS is deliberately absent: nothing is shipped for it, so there is nothing to protect.
#
# **Every build tag, every time.** internal/trace selects a different file on `debugtrace`
# and internal/idle does the same on `idleexit`, so one configuration compiles while another
# does not. That has broken before, and a CI that only checked the default build would not
# have caught it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. This workflow inspects the code and publishes nothing.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      # Let both platforms report. Cancelling the sibling on the first failure hides whether
      # a break is platform-specific, which is the main thing having two runners tells you.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}
    # bash on both, so every step below is written once rather than twice. It is the default
    # on Linux and available on the Windows runners.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # Ebitengine is pure Go on Windows and cgo on Linux, where it links against X11 for the
      # window and input, GL for drawing and ALSA for audio. Matches the release workflow's
      # list; if one changes the other has to.
      - name: install ebitengine build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config

      - uses: actions/setup-go@v5
        with:
          # Reads the version from go.mod, so the toolchain cannot drift from the module.
          go-version-file: go.mod
          cache: true

      # gofmt exits 0 whether or not it found anything, so the check is on its output. Run on
      # one platform only — formatting is a property of the source, not of the runner, and
      # two identical reports would just be noise.
      - name: gofmt
        if: runner.os == 'Windows'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          go vet -tags debugtrace ./...
          go vet -tags idleexit ./...

      - name: build
        run: |
          go build ./...
          go build -tags debugtrace ./...
          go build -tags idleexit ./...

      # internal/combat is the only package with tests, by design: it is the only one that
      # needs no window. Keep it that way and this step needs no display server, which is
      # what lets it run on a headless Linux runner at all.
      - name: test
        run: go test ./...
