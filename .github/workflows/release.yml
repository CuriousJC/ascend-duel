# Builds downloadable binaries and publishes them as a GitHub Release.
#
# **Two ways in, and they produce the same release.** Either push a version tag:
#
#     git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#
# or run the workflow by hand from the Actions tab against `main`, giving it the version to
# cut. The manual path creates the tag itself, at the commit it built, so releasing does not
# require a local tag-and-push. **Pushing a `v*` tag is still releasing** — there is no
# approval between the two, so push one only when the commit it points at is the thing to
# ship.
#
# **The version is resolved once, in the `version` job, and everything downstream reads it.**
# `GITHUB_REF_NAME` is the tag on one path and the branch name on the other, so nothing below
# may use it — a build stamped `-X main.version=main` is the failure this avoids.
#
# **Only first-party actions.** Everything here is from `actions/` — checkout, setup-go,
# upload/download-artifact — and publishing runs through the `gh` CLI preinstalled on the
# runner rather than a marketplace action. A release workflow holds a write token, so it is
# the last place to hand execution to code nobody in this repo reviews.
#
# **Build jobs never publish.** They upload artifacts and a single `publish` job creates the
# release once, because two jobs both calling `gh release create` is a race where one of them
# loses.
name: Release

on:
  push:
    tags:
      - "v*"

  # The manual path. `version` is typed into the Actions tab; the run must be started against
  # `main`, which the version job enforces rather than trusting the dropdown.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.2. The tag is created for you."
        required: true
        type: string

# Build jobs need nothing but the code. Only publish gets a write token.
permissions:
  contents: read

# One release at a time. Two runs cutting different versions would race in `publish`, and
# cancelling a half-finished release is worse than making the second one wait.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Resolves the version string and refuses the run if it is not one. Everything else
  # `needs:` this, so a bad input costs one cheap job rather than two full builds.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The input is read through the environment and never interpolated into the script.
      # `${{ inputs.version }}` pasted inline would be executed by the shell, and this job
      # is one `needs:` away from a job that holds a write token.
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Tag push: the ref already is the version, and the tag pattern vetted it.
          if [ "$EVENT" != "workflow_dispatch" ]; then
            echo "releasing tag $REF_NAME"
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual run can be pointed at any branch from the Actions tab. Releases come
          # off main, so anything else is a mistake rather than an intention.
          if [ "$REF_NAME" != "main" ]; then
            echo "::error::manual releases run from main; this run was started on $REF_NAME"
            exit 1
          fi

          if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$INPUT_VERSION' is not a version: expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

          # gh would happily create a release against an existing tag, quietly shipping
          # binaries built from a different commit than the one that tag names.
          if git ls-remote --exit-code --tags origin "refs/tags/$INPUT_VERSION" >/dev/null 2>&1; then
            echo "::error::tag $INPUT_VERSION already exists"
            exit 1
          fi

          echo "releasing $INPUT_VERSION from $GITHUB_SHA"
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The same gates CI runs. A tag can be pushed at any commit, including one that never
      # went through a pull request, so the release path cannot assume CI has already passed
      # on this code.
      - name: vet
        run: |
          go vet ./...
          go vet -tags debugtrace ./...

      - name: test
        run: go test ./...

      # -H=windowsgui suppresses the console window that would otherwise open behind the
      # game. -s -w drop the symbol table and DWARF, and -trimpath keeps build-machine paths
      # out of the binary. Neither debugtrace nor idleexit is set: instrumentation must never
      # be in a binary that ships, and a game that closes itself on an idle player is a bug.
      #
      # -X stamps the tag into the binary, which is what lets a bug report name a build. The
      # filename carries it too, but a filename stops travelling with the exe the moment it
      # is renamed or a screenshot is all you have.
      - name: build
        shell: bash
        run: |
          go build -trimpath \
            -ldflags "-H=windowsgui -s -w -X main.version=${VERSION}" \
            -o "ascend-duel-${VERSION}-windows-amd64.exe" .
          ls -l ascend-duel-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ascend-duel-*.exe
          if-no-files-found: error

  linux:
    # **22.04 rather than latest, on purpose.** A cgo binary links against the glibc of the
    # machine that built it and will not start on anything older, so building on the newest
    # runner available quietly narrows who can run the result. The oldest supported image is
    # the widest audience.
    runs-on: ubuntu-22.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # **Ebitengine needs cgo on Linux**, unlike Windows where it is pure Go. These are the
      # headers it links against: X11 for the window and input, GL for drawing, ALSA for
      # audio. Without them the build fails at the linker with missing -lX11 and friends.
      - name: install ebitengine build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libasound2-dev pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: |
          go vet ./...
          go vet -tags debugtrace ./...

      # Three of the four tested packages link Ebitengine, and on Linux its ui package calls
      # glfw.Init() from an init() — so a test binary panics on a missing DISPLAY before any
      # test runs, however headless the tests are. xvfb-run supplies a throwaway X server to
      # get past that constructor; nothing here ever draws to it. Same reasoning as CI, and
      # this job matters more: without it a tag dies at the test step and the release never
      # publishes. Kept out of the build-dependency list above because it is not one — that
      # list is shared with CI and stays identical to it.
      - name: install a virtual display for the tests
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: test
        run: xvfb-run -a go test ./...

      # No -H=windowsgui here: it is a Windows linker flag and Linux has no console to hide.
      #
      # **Shipped as a tar.gz rather than a bare binary.** GitHub release assets carry no file
      # permissions, so a raw download arrives without its execute bit and does not run. A tar
      # preserves it and is what a Linux user expects to find anyway.
      - name: build
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ascend-duel .
          tar czf "ascend-duel-${VERSION}-linux-amd64.tar.gz" ascend-duel
          ls -l ascend-duel-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ascend-duel-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    # The only elevated permission in the repo, and it is scoped to this one job.
    permissions:
      contents: write

    steps:
      # Needed for the notes file; the binaries come from the artifacts below.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lR dist

      # Hand-written notes when the version has them, generated ones when it does not. A
      # release that forgot its notes file should still publish rather than failing after two
      # successful builds — the binaries are the point and the notes are the courtesy.
      #
      # `--target` is what makes the manual path work: gh creates the tag at that commit when
      # it does not already exist, and GitHub ignores the target for a tag that does. So the
      # tag-push path is unchanged and the manual path tags exactly the commit it just built.
      #
      # A tag created here cannot re-trigger this workflow — GITHUB_TOKEN pushes do not raise
      # workflow events — so the manual run publishes once rather than looping.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${VERSION}.md"
          if [ -f "$notes" ]; then
            echo "using $notes"
            set -- --notes-file "$notes"
          else
            echo "no $notes, generating notes from commit history"
            set -- --generate-notes
          fi

          gh release create "${VERSION}" \
            dist/* \
            --title "${VERSION}" \
            --target "${GITHUB_SHA}" \
            "$@"
